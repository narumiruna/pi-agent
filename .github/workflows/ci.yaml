name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: pi-agent
          POSTGRES_USER: pi-agent
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pi-agent -d pi-agent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql://pi-agent:test-password@127.0.0.1:5432/pi-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run ci
      - run: docker build -t pi-agent:ci .

  e2e:
    name: e2e (${{ matrix.store }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - store: sqlite
            database_url: ""
          - store: postgres
            database_url: postgresql://pi-agent:test-password@127.0.0.1:5432/pi_agent_e2e
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: pi_agent_e2e
          POSTGRES_USER: pi-agent
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pi-agent -d pi_agent_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_DATABASE_URL: ${{ matrix.database_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.store }}-failure
          path: |
            .local/e2e/report
            .local/e2e/results
          retention-days: 7
