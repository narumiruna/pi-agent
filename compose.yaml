services:
  agent:
    build: .
    image: pi-agent:local
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      APP_ORIGIN: ${APP_ORIGIN:?Set APP_ORIGIN}
      HOST: ${HOST:-0.0.0.0}
      AUTH_MODE: ${AUTH_MODE:-oidc}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_OWNER_SUB: ${OIDC_OWNER_SUB:-}
      OIDC_OWNER_EMAIL: ${OIDC_OWNER_EMAIL:-}
      AGENT_TOOLS: ${AGENT_TOOLS:-read,grep,find,ls}
    volumes:
      - pi-agent:/app/.pi/agent
      - app-data:/app/data
      - workspace:/workspace

volumes:
  pi-agent:
  app-data:
  workspace:
